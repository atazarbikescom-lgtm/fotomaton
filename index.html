<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotomatón Glup Madrid</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <header class="bg-slate-950 py-4 px-6 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-pink-500">Fotomatón Glup Madrid</h1>
        <a href="tel:600000000" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-full font-medium text-sm transition">Llamar</a>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-12">
        <section class="text-center space-y-4">
            <h2 class="text-3xl md:text-4xl font-extrabold text-white">Tu evento inolvidable</h2>
            <p class="text-slate-300 text-lg">El mejor fotomatón para bodas, fiestas y eventos en Madrid.</p>
            <a href="https://wa.me/600000000" class="inline-block bg-green-600 hover:bg-green-700 text-white font-bold px-8 py-3 rounded-xl transition text-lg shadow-lg">Reservar por WhatsApp</a>
        </section>

        <section class="bg-slate-800 p-4 rounded-2xl shadow-xl">
            <h3 class="text-xl font-semibold mb-4 text-center text-pink-400">Vídeo en acción</h3>
            <div class="aspect-video bg-slate-900 rounded-lg overflow-hidden flex items-center justify-center">
                <video controls class="w-full h-full object-cover">
                    <source src="media/video_vivo.mp4" type="video/mp4">
                    Tu navegador no soporta vídeos.
                </video>
            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-xl font-semibold text-center text-pink-400">Galería</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-800 rounded-xl overflow-hidden shadow-md aspect-square flex items-center justify-center">
                    <img src="media/foto1.jpg" alt="Foto 1" class="w-full h-full object-cover">
                </div>
                <div class="bg-slate-800 rounded-xl overflow-hidden shadow-md aspect-square flex items-center justify-center">
                    <img src="media/foto2.jpg" alt="Foto 2" class="w-full h-full object-cover">
                </div>
                <div class="bg-slate-800 rounded-xl overflow-hidden shadow-md aspect-square flex items-center justify-center">
                    <img src="media/foto3.jpg" alt="Media/foto3.jpg" class="w-full h-full object-cover">
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-slate-950 text-center py-6 mt-12 text-slate-400 text-sm">
        <p>Contacto: 600 00 00 00 | Madrid</p>
    </footer>
</body>
</html>
